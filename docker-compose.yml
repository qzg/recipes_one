version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipes_postgres
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: recipes_server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recipes
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-changeme}
      PORT: 3000
      RUST_LOG: server=debug,tower_http=debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: WASM frontend (experimental)
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: recipes_frontend
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - server
  #   restart: unless-stopped

volumes:
  postgres_data:
